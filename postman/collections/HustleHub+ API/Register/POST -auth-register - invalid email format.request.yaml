$kind: http-request
name: POST /auth/register - invalid email format
url: "{{baseUrl}}/auth/register"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "fullName": "Test User",
      "email": "not-an-email",
      "password": "Password123",
      "role": "client"
    }
order: 4000
