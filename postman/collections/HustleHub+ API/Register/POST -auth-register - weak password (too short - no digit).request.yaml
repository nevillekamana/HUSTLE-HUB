$kind: http-request
name: POST /auth/register - weak password (too short / no digit)
url: "{{baseUrl}}/auth/register"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "fullName": "Test User",
      "email": "weakpass@example.com",
      "password": "short",
      "role": "client"
    }
order: 5000
