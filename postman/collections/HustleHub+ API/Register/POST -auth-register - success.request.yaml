$kind: http-request
name: POST /auth/register - success
url: "{{baseUrl}}/auth/register"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "fullName": "Test User",
      "email": "{{testEmail}}",
      "password": "Password123",
      "role": "client"
    }
scripts:
  - type: beforeRequest
    code: pm.collectionVariables.set('testEmail', 'user' + Date.now() + '@example.com');
    language: text/javascript
order: 1000
